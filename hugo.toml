baseURL = "https://blog.liamdgray.com"
title = "LiamDGray"
theme = "minimal"
enableRobotsTXT = true
enableGitInfo = true
languageCode = "en-us"
DefaultContentLanguage = "en"

[pagination]
pagerSize = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  description = "Personal blog by LiamDGray"
  github = "https://github.com/liamdgray"
  giscus_enable = true
  giscus_repo = "LiamDGray/blog"
  giscus_repo_id = "R_kgDOTTtdJg"
  giscus_category = "Announcements"
  giscus_category_id = "DIC_kwDOTTtdJs4DA2rS"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
