<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 155 }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">

  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:site_name" content="Liam D. Gray">
  <meta property="og:title" content="{{ if .IsHome }}Liam D. Gray — Writing{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 155 }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:locale" content="en_US">

  {{ with .OutputFormats.Get "RSS" -}}
    <link href="{{ .Permalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}">
    <link href="{{ .Permalink }}" rel="feed" type="application/rss+xml" title="{{ $.Site.Title }}">
  {{- end }}

  {{ if .IsPage }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ .Title | jsonify }},
    "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
    "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
    "url": {{ .Permalink | jsonify }},
    "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | plainify | truncate 155 | jsonify }}{{ end }},
    "author": { "@type": "Person", "name": "Liam D. Gray", "url": "https://liamdgray.com/" },
    "mainEntityOfPage": { "@type": "WebPage", "@id": {{ .Permalink | jsonify }} }
  }
  </script>
  {{ end }}

  <!-- Same stylesheet as liamdgray.com, so the palette and type cannot drift. -->
  <link rel="stylesheet" href="https://liamdgray.com/css/style.css">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ now.Unix }}">
  <script>
    (function(){
      function read(){
        try{var m=document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/);if(m)return m[1];}catch(e){}
        try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')return t;}catch(e){}
        return null;
      }
      var t=read();
      if(t)document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  {{ block "head_extra" . }}{{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    (function(){
      var root = document.documentElement;

      function readCookie(){
        try{var m=document.cookie.match(/(?:^|;\s*)theme=(dark|light)(?:;|$)/);if(m)return m[1];}catch(e){}
        return null;
      }

      function writeTheme(t){
        try{localStorage.setItem('theme',t);}catch(e){}
        try{
          var secure = location.protocol === 'https:' ? '; Secure' : '';
          var domain = (location.hostname === 'liamdgray.com' || /\.liamdgray\.com$/.test(location.hostname))
            ? '; Domain=liamdgray.com' : '';
          document.cookie = 'theme=' + t + '; Path=/; Max-Age=31536000; SameSite=Lax' + domain + secure;
        }catch(e){}
      }

      function isDark(){
        var attr = root.getAttribute('data-theme');
        if(attr) return attr === 'dark';
        var c = readCookie();
        if(c) return c === 'dark';
        try{var s=localStorage.getItem('theme');if(s==='dark'||s==='light')return s==='dark';}catch(e){}
        return window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      var btn = document.querySelector('.theme-toggle');
      function label(){
        if(!btn) return;
        var dark = isDark();
        btn.textContent = dark ? 'Light' : 'Dark';
        btn.setAttribute('aria-pressed', String(dark));
        btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      if (btn) {
        label();
        btn.addEventListener('click', function(){
          var next = isDark() ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          writeTheme(next);
          label();
        });
      }

      // The main site writes the same cookie from its own subdomain, so re-read
      // it when this tab regains focus.
      window.addEventListener('focus', function(){
        var c = readCookie();
        if (c && c !== root.getAttribute('data-theme')) {
          root.setAttribute('data-theme', c);
          label();
        }
      });

      var navToggle = document.querySelector('.nav-toggle');
      var navLinks = document.getElementById('nav-links');
      if (navToggle && navLinks) {
        navToggle.addEventListener('click', function(){
          var open = navLinks.classList.toggle('open');
          navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }
    })();
  </script>
</body>
</html>
